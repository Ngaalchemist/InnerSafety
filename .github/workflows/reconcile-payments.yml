name: Reconcile pending payments

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest

    steps:
      - name: Call reconcile endpoint
        run: |
          curl -sf -X GET "https://beyondfear.ngaalchemist.com/api/checkout/reconcile" \
            -H "Authorization: Bearer ${{ secrets.RECONCILE_SECRET }}"
